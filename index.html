<!DOCTYPE html>
<html lang="zh-HK">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freedress Music</title>

<style>

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #ffe4ef, #ffc1d9);

    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
}


.card {
    width: 320px;
    padding: 35px 25px;
    text-align: center;

    background: rgba(255,255,255,0.92);

    border-radius: 25px;

    box-shadow: 0 10px 30px rgba(255,120,160,0.25);
}


.logo {
    font-size: 45px;
}


h1 {
    font-size: 30px;
    letter-spacing: 3px;
    color: #d66a91;
}


p {
    font-size: 16px;
    line-height: 2;
    color: #666;
}


audio {
    width: 100%;
    margin-top: 20px;
}


.footer {
    margin-top: 20px;
    font-size: 13px;
    color: #aaa;
}

</style>

</head>


<body>


<div class="card">


<div class="logo">🌙</div>


<h1>Freedress</h1>


<p>
祝大家中秋節快樂<br>
年年都跟我們在一起 👩‍❤️‍💋‍👩
</p>


<audio controls playsinline preload="metadata">

<source src="./大南西街.mp3" type="audio/mp4">


</audio>


<div class="footer">
Made with ❤️
</div>


</div>


</body>

</html>
